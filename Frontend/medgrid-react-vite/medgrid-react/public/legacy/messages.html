<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MedGrid modern healthcare frontend prototype">
  <title>Messages · MedGrid</title>
  <style>
    :root {
      --primary: #1464d2;
      --primary-dark: #0e4da8;
      --secondary: #13a67a;
      --accent: #e9f3ff;
      --bg: #f6f9fc;
      --surface: #fff;
      --text: #172033;
      --muted: #667085;
      --border: #dfe6ef;
      --danger: #d92d20;
      --warning: #b54708;
      --success: #087443;
      --shadow: 0 12px 35px rgba(16, 36, 64, .08);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 180ms ease;
    }

    [data-theme="dark"] {
      --bg: #0f1722;
      --surface: #17212e;
      --text: #f2f6fb;
      --muted: #aab7c7;
      --border: #2b3a4c;
      --accent: #17365f;
      --shadow: 0 12px 35px rgba(0, 0, 0, .22);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    img {
      max-width: 100%;
      display: block
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 10px;
      background: #fff;
      padding: 10px
    }

    .skip-link:focus {
      left: 10px;
      z-index: 9999
    }

    .topbar {
      background: #0f4da8;
      color: #fff;
      font-size: 13px
    }

    .topbar .container {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0
    }

    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 24px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      color: var(--primary)
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
      margin-left: auto
    }

    .nav-links a {
      color: var(--muted);
      font-weight: 600
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary)
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .mobile-menu {
      display: none
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 17px;
      font-weight: 700;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn:focus-visible,
    .icon-btn:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(20, 100, 210, .25);
      outline-offset: 2px
    }

    .btn-primary {
      background: var(--primary);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--primary-dark)
    }

    .btn-secondary {
      background: var(--secondary);
      color: #fff
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text)
    }

    .btn-soft {
      background: var(--accent);
      color: var(--primary)
    }

    .btn-danger {
      background: #fee4e2;
      color: var(--danger)
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: grid;
      place-items: center
    }

    .hero {
      padding: 78px 0 55px;
      background: radial-gradient(circle at 85% 15%, #dff3ef, transparent 30%), linear-gradient(180deg, var(--surface), var(--bg))
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 60px;
      align-items: center
    }

    .eyebrow {
      color:#13a67a;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: 15px;
    }

    .hero h1 {
      font-size: clamp(38px, 5vw, 64px);
      line-height: 1.05;
      margin: 13px 0 18px;
      letter-spacing: -.04em
    }

    .hero p {
      font-size: 18px;
      color: var(--muted);
      max-width: 640px
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 15px;
      padding: 8px;
      display: flex;
      gap: 8px;
      margin-top: 25px
    }

    .search-box input {
      border: 0;
      outline: 0;
      background: transparent;
      flex: 1;
      min-width: 0;
      padding: 11px
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow)
    }

    .hero-card .pulse {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px
    }

    .pulse-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 0 7px rgba(19, 166, 122, .12)
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 25px 0
    }

    .stat-card,
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .stat-card {
      padding: 20px
    }

    .stat-card strong {
      display: block;
      font-size: 27px
    }

    .muted {
      color: var(--muted)
    }

    .section {
      padding: 64px 0
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 25px
    }

    .section-head h2 {
      font-size: 30px;
      margin-bottom: 5px
    }

    .grid {
      display: grid;
      gap: 18px
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr)
    }

    .specialty {
      padding: 22px;
      text-align: center
    }

    .specialty .specialty-icon {
      font-size: 32px;
      margin-bottom: 10px
    }

    .specialty:hover {
      border-color: #9ec4f4;
      transform: translateY(-2px)
    }

    .testimonial {
      padding: 25px
    }

    .stars {
      color: #f59e0b;
      letter-spacing: 2px
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent)
    }

    .avatar-lg {
      width: 86px;
      height: 86px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      background: var(--accent);
      color: var(--primary)
    }

    .badge.success {
      background: #dcfae8;
      color: var(--success)
    }

    .badge.warning {
      background: #fef0c7;
      color: var(--warning)
    }

    .badge.danger {
      background: #fee4e2;
      color: var(--danger)
    }

    .form-group {
      margin-bottom: 17px
    }

    .form-label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 11px;
      padding: 12px 13px
    }

    .textarea {
      min-height: 110px;
      resize: vertical
    }

    .input.error,
    .select.error {
      border-color: var(--danger)
    }

    .field-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 5px;
      min-height: 17px
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px
    }

    .auth-card {
      width: min(470px, 100%);
      padding: 32px
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 22px
    }

    .checkbox {
      display: flex;
      gap: 9px;
      align-items: flex-start
    }

    .checkbox input {
      margin-top: 4px
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      margin: 20px 0
    }

    .divider:before,
    .divider:after {
      content: "";
      height: 1px;
      background: var(--border);
      flex: 1
    }

    .app-shell {
      min-height: 100vh
    }

    .app-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px;
      z-index: 70;
      transition: transform var(--transition)
    }

    .sidebar-nav {
      display: grid;
      gap: 6px;
      margin-top: 30px
    }

    .sidebar-nav a {
      padding: 11px 13px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 650
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: var(--accent);
      color: var(--primary)
    }

    .sidebar-bottom {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px
    }

    .app-main {
      margin-left: 250px;
      min-height: 100vh
    }

    .app-header {
      height: 72px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 40
    }

    .main-content {
      padding: 28px
    }

    .page-title {
      margin-bottom: 22px
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px
    }

    .span-4 {
      grid-column: span 4
    }

    .span-6 {
      grid-column: span 6
    }

    .span-8 {
      grid-column: span 8
    }

    .span-12 {
      grid-column: span 12
    }

    .widget {
      padding: 22px
    }

    .metric {
      font-size: 30px;
      font-weight: 850
    }

    .progress {
      height: 8px;
      background: var(--accent);
      border-radius: 999px;
      overflow: hidden
    }

    .progress>span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: inherit
    }

    .table-wrap {
      overflow: auto
    }

    .data-table {
      width: 100%;
      border-collapse: collapse
    }

    .data-table th,
    .data-table td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap
    }

    .data-table th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .doctor-card {
      padding: 20px
    }

    .doctor-card .doctor-top {
      display: flex;
      gap: 14px
    }

    .doctor-card .doctor-info {
      flex: 1
    }

    .doctor-card h3 {
      margin: 0 0 3px
    }

    .doctor-card .meta {
      font-size: 13px;
      color: var(--muted)
    }

    .doctor-actions {
      display: flex;
      gap: 8px;
      margin-top: 17px
    }

    .doctor-actions .btn {
      flex: 1
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 19, 32, .55);
      display: none;
      place-items: center;
      padding: 20px;
      z-index: 100
    }

    .modal-backdrop.open {
      display: grid
    }

    .modal {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
      animation: modalIn .18s ease
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: start
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px
    }

    .toast-region {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      display: grid;
      gap: 10px
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 13px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      min-width: 260px;
      animation: toastIn .2s ease
    }

    .toast.success {
      border-left-color: var(--secondary)
    }

    .toast.error {
      border-left-color: var(--danger)
    }

    .tabs {
      display: flex;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      overflow: auto
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 11px 14px;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      border-bottom: 2px solid transparent
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary)
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 128px);
      min-height: 560px
    }

    .chat-list {
      border-right: 1px solid var(--border);
      overflow: auto
    }

    .chat-item {
      display: flex;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      /* background-color: #22c58b; */
    }

    .chat-item.active,
    .chat-item:hover {
      background: var(--accent)
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .chat-head {
      padding: 15px;
      border-bottom: 1px solid var(--border)
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: grid;
      align-content: start;
      gap: 10px
    }

    .bubble {
      max-width: 72%;
      padding: 11px 14px;
      border-radius: 15px;
      background: var(--accent)
    }

    .bubble.mine {
      justify-self: end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px
    }

    .bubble.theirs {
      border-bottom-left-radius: 4px
    }

    .chat-compose {
      display: flex;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid var(--border)
    }

    .timeline {
      display: grid;
      gap: 15px
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 16px
    }

    .timeline-item time {
      color: var(--muted);
      font-size: 13px
    }

    .empty {
      text-align: center;
      padding: 45px;
      color: var(--muted)
    }

    .footer {
      padding: 35px 0;
      border-top: 1px solid var(--border);
      color: var(--muted)
    }

    .hidden {
      display: none !important
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(15px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important
      }
    }

    .notification-panel {
      position: fixed;
      right: 20px;
      top: 78px;
      width: min(360px, calc(100% - 40px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      z-index: 90;
      padding: 6px
    }

    .notification-row {
      padding: 13px;
      border-bottom: 1px solid var(--border)
    }

    .notification-row:last-child {
      border-bottom: 0
    }

    .notification-row p {
      font-size: 13px;
      margin: 4px 0
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr)
    }

    @media(max-width:575px) {
      .grid-2 {
        grid-template-columns: 1fr
      }

      .nav-links.mobile-open {
        display: grid;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        background: var(--surface);
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow)
      }
    }

    /* MedGrid visual refresh — keeps all original content, adds colour and interaction */
    :root {
      --purple: #7c3aed;
      --pink: #ec4899;
      --cyan: #06b6d4
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #5b8def);
      box-shadow: 0 8px 18px rgba(20, 100, 210, .20)
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--secondary), #22c58b)
    }

    .card,
    .stat-card,
    .hero-card {
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease
    }

    .card:hover,
    .stat-card:hover,
    .hero-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 45px rgba(16, 36, 64, .12)
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 10% 15%, rgba(124, 58, 237, .10), transparent 28%), radial-gradient(circle at 88% 20%, rgba(19, 166, 122, .16), transparent 30%), linear-gradient(180deg, var(--surface), var(--bg))
    }

    .hero:before,
    .hero:after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      pointer-events: none
    }

    .hero:before {
      width: 180px;
      height: 180px;
      background: rgba(236, 72, 153, .08);
      right: -60px;
      bottom: -40px
    }

    .hero:after {
      width: 120px;
      height: 120px;
      background: rgba(6, 182, 212, .08);
      left: 35%;
      top: 15px
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 8% 15%, rgba(20, 100, 210, .18), transparent 28%), radial-gradient(circle at 92% 85%, rgba(19, 166, 122, .18), transparent 28%), linear-gradient(135deg, #f7fbff, #eef8f6)
    }

    .auth-shell:before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124, 58, 237, .12), rgba(236, 72, 153, .08));
      top: -180px;
      right: -120px
    }

    .auth-shell:after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(6, 182, 212, .08);
      bottom: -150px;
      left: -90px
    }

    .auth-card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 28px 80px rgba(16, 36, 64, .15)
    }

    .auth-card .auth-brand {
      padding: 38px 38px 0
    }

    .auth-visual {
      min-height: 620px;
      padding: 38px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #0e5bc4, #13a67a);
      color: #fff;
      position: relative;
      overflow: hidden
    }

    .auth-visual:before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border: 55px solid rgba(255, 255, 255, .10);
      border-radius: 50%;
      right: -110px;
      top: -70px
    }

    .auth-visual:after {
      content: "";
      position: absolute;
      width: 190px;

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      setupNavigation();
      setupToasts();
      setupModals();
      setupNotifications();
      setupGlobalSearch();
      document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());
    });
    function applyTheme() { const theme = localStorage.getItem("medgridTheme") || "light"; document.documentElement.dataset.theme = theme; document.querySelectorAll("[data-theme-toggle]").forEach(x => x.checked = theme === "dark"); }
    function toggleTheme() { const next = (document.documentElement.dataset.theme === "dark" ? "light" : "dark"); localStorage.setItem("medgridTheme", next); applyTheme(); toast(`${next === "dark" ? "Dark" : "Light"} mode enabled`, "success"); }
    function setupNavigation() {
      document.querySelectorAll("[data-sidebar-toggle]").forEach(b => b.addEventListener("click", () => { document.querySelector(".app-sidebar")?.classList.toggle("open"); document.querySelector(".sidebar-overlay")?.classList.toggle("open"); }));
      document.querySelector(".sidebar-overlay")?.addEventListener("click", () => { document.querySelector(".app-sidebar")?.classList.remove("open"); document.querySelector(".sidebar-overlay")?.classList.remove("open") });
      document.querySelector("[data-mobile-menu]")?.addEventListener("click", () => document.querySelector(".nav-links")?.classList.toggle("mobile-open"));
      document.querySelectorAll("[data-theme-toggle]").forEach(x => x.addEventListener("change", toggleTheme));
    }
    function toast(message, type = "info") {
      let region = document.querySelector(".toast-region"); if (!region) { region = document.createElement("div"); region.className = "toast-region"; region.setAttribute("aria-live", "polite"); document.body.appendChild(region); }
      const el = document.createElement("div"); el.className = `toast ${type}`; el.textContent = message; region.appendChild(el); setTimeout(() => el.remove(), 3200);
    }
    function setupToasts() { document.querySelectorAll("[data-toast]").forEach(b => b.addEventListener("click", () => toast(b.dataset.toast, "success"))); }
    function openModal(id) { const m = document.getElementById(id); if (m) { m.classList.add("open"); m.setAttribute("aria-hidden", "false"); m.querySelector("button, input, select")?.focus(); } }
    function closeModal(id) { const m = document.getElementById(id); if (m) { m.classList.remove("open"); m.setAttribute("aria-hidden", "true"); } }
    function setupModals() {
      document.querySelectorAll("[data-modal-open]").forEach(b => b.addEventListener("click", () => openModal(b.dataset.modalOpen)));
      document.querySelectorAll("[data-modal-close]").forEach(b => b.addEventListener("click", () => closeModal(b.closest(".modal-backdrop").id)));
      document.querySelectorAll(".modal-backdrop").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal(m.id) }));
      document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".modal-backdrop.open").forEach(m => closeModal(m.id)); });
    }
    function setupNotifications() {
      const btn = document.querySelector("[data-notifications]"), panel = document.querySelector("[data-notification-panel]");
      if (!btn || !panel) return; btn.addEventListener("click", () => panel.classList.toggle("hidden"));
      panel.innerHTML = notifications.map(n => `<div class="notification-row"><strong>${n.title}</strong><p class="muted">${n.text}</p><small>${n.time}</small></div>`).join("");
    }
    function setupGlobalSearch() { document.querySelectorAll("[data-search-link]").forEach(f => f.addEventListener("submit", e => { e.preventDefault(); location.href = `doctors.html?q=${encodeURIComponent(f.querySelector("input").value)}` })); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
    function doctorCard(d) { return `<article class="card doctor-card"><div class="doctor-top"><img class="avatar avatar-lg" src="${d.image}" alt="Portrait placeholder for ${escapeHtml(d.name)}"><div class="doctor-info"><h3>${escapeHtml(d.name)}</h3><div class="meta">${d.specialty} · ${d.experience} yrs</div><div class="meta">★ ${d.rating} · ₹${d.fee} · ${d.location}</div></div></div><p class="muted" style="margin-top:15px">${escapeHtml(d.bio)}</p><div class="doctor-actions"><a class="btn btn-outline" href="doctor-profile.html?id=${d.id}">View Profile</a><a class="btn btn-primary" href="appointment.html?doctor=${d.id}">Book</a></div></article>`; }
    function doctorName(id) { return doctorById(id)?.name || "MedGrid Care Team"; }

  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.getElementById("chatList"), windowEl = document.getElementById("chatWindow"); if (!list) return; let selected = 1;
      const renderList = (q = "") => { list.innerHTML = doctors.filter(d => (d.id === 1 || d.id === 2 || d.id === 7) && d.name.toLowerCase().includes(q.toLowerCase())).map(d => `<button class="chat-item ${selected === d.id ? "active" : ""}" data-chat="${d.id}"><img class="avatar" src="${d.image}" alt=""><span><strong>${d.name}</strong><small class="muted">${d.specialty}</small></span></button>`).join(""); list.querySelectorAll("[data-chat]").forEach(b => b.addEventListener("click", () => { selected = Number(b.dataset.chat); renderList(); renderChat() })) };
      const renderChat = () => { const d = doctorById(selected), msgs = messages[selected] || []; windowEl.innerHTML = `<div class="chat-head"><div class="row"><img class="avatar" src="${d.image}" alt=""><div><strong>${d.name}</strong><div class="muted">${d.specialty}</div></div></div></div><div class="messages" id="messageStream">${msgs.map(m => `<div class="bubble ${m.from === "me" ? "mine" : "theirs"}">${escapeHtml(m.text)}<div style="font-size:11px;opacity:.7;margin-top:4px">${m.time}</div></div>`).join("")}</div><form class="chat-compose" id="messageForm"><label class="icon-btn" title="Attach file"><input class="sr-only" type="file" id="attachment">📎</label><input class="input" id="messageInput" placeholder="Type a secure message…" aria-label="Message"><button class="btn btn-primary">Send</button></form>`; document.getElementById("messageForm").addEventListener("submit", e => { e.preventDefault(); const input = document.getElementById("messageInput"); if (!input.value.trim()) return; (messages[selected] ||= []).push({ from: "me", text: input.value.trim(), time: "Now" }); renderChat(); setTimeout(() => { (messages[selected] ||= []).push({ from: "doctor", text: "Thanks for your message. This is a simulated reply for the prototype.", time: "Now" }); renderChat() }, 900) }); };
      document.getElementById("chatSearch").addEventListener("input", e => renderList(e.target.value)); renderList(); renderChat();
    });

  </script>
</body>

</html>
